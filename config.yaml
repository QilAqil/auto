hotkey:
  mulai_su: \
  mulai_bt: '`'
  mulai: f1
  jeda_su: \
  jeda_bt: '`'
  reset: f3
  exit: esc
search_region:
- 88
- 140
- 950
- 650
delay:
  antar_field: 0.2
  setelah_klik: 0.25
  setelah_ketik: 0.15
  setelah_tab: 0.1
  antar_putaran: 0.5
retry:
  max_attempts: 3
  interval_sec: 0.4
locator:
  grayscale: true
  confidence: 0.75
  cache_pad: 80
ocr:
  enabled: false
  bahasa:
  - id
  - en
  allowlist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/-. '
  panjang_tepat: null
  min_len: 1
  max_len: 200
  model_dir: ocr_models
  pipelines:
  - hsv_threshold
  - clahe
  - invert
  - bilateral
  - sharpen
mode:
